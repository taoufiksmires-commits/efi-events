<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absents — EFI Events</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05050f;--surface:#111124;--border:rgba(255,255,255,.08);--muted:rgba(255,255,255,.45);--text:#f0f0f8;--accent:#e8251a;--success:#2dd4a0;--warn:#ff6b35}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px 16px 40px}
.wrap{max-width:520px;margin:0 auto}
.logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#c41d13);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;box-shadow:0 10px 30px rgba(232,37,26,.35)}
h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:6px}
.maj{text-align:center;color:var(--muted);font-size:10px;margin-bottom:20px}
.maj .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;margin-bottom:12px;outline:none}
.row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.row .name{font-weight:600;font-size:14px}
.row .meta{font-size:11px;color:var(--muted)}
.row .abs{margin-left:auto;color:var(--warn);font-size:12px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">📋</div>
  <h1>Invités absents</h1>
  <div class="sub" id="ev-nom">Chargement…</div>
  <div class="maj"><span class="dot"></span>Mise à jour automatique — <span id="maj-time">—</span></div>

  <div class="stats">
    <div class="stat"><div class="stat-num" style="color:var(--success)" id="nb-presents">—</div><div class="stat-lbl">Présents</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--warn)" id="nb-absents">—</div><div class="stat-lbl">Absents</div></div>
    <div class="stat"><div class="stat-num" id="nb-invites">—</div><div class="stat-lbl">Invités</div></div>
  </div>

  <select id="ev-sel" onchange="render()" style="display:none"></select>
  <input type="text" id="search" placeholder="🔍 Chercher un nom…" oninput="render()">
  <div id="liste"><div class="empty">Chargement…</div></div>
</div>
<script>
var URL_='https://aygrpgccjzwdhwtqbotw.supabase.co';
var KEY_='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5Z3JwZ2Njanp3ZGh3dHFib3R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MTE0MDEsImV4cCI6MjA5NjE4NzQwMX0.KP9oXyPhvznoy-EzIQUIoYjCHfMUMtUwA59YnVmXm78';
function api(t){return URL_+'/rest/v1/'+t;}
function H(){return {'apikey':KEY_,'Authorization':'Bearer '+KEY_};}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}

var users=[],presences=[],invitations=[],events=[];

async function load(){
  try{
    var r=await Promise.all([
      fetch(api('evenements')+'?order=date.desc',{headers:H()}).then(function(x){return x.json();}),
      fetch(api('users')+'?select=id,nom,prenom,departement,contrat',{headers:H()}).then(function(x){return x.json();}),
      fetch(api('presences')+'?present=eq.true&select=evenement_id,user_id',{headers:H()}).then(function(x){return x.json();}),
      fetch(api('invitations')+'?select=evenement_id,user_id',{headers:H()}).then(function(x){return x.json();})
    ]);
    events=Array.isArray(r[0])?r[0]:[];
    users=Array.isArray(r[1])?r[1]:[];
    presences=Array.isArray(r[2])?r[2]:[];
    invitations=Array.isArray(r[3])?r[3]:[];
    var sel=document.getElementById('ev-sel');
    if(events.length>1){
      var cur=sel.value;
      sel.style.display='block';
      sel.innerHTML=events.map(function(e){return '<option value="'+e.id+'">'+esc(e.nom)+'</option>';}).join('');
      // Pré-sélectionner l'événement 90
      if(cur) sel.value=cur;
      else{
        var ev90=events.find(function(e){return (e.nom||'').toLowerCase().indexOf('90')>=0;});
        if(ev90) sel.value=ev90.id;
      }
    } else if(events.length===1){
      sel.innerHTML='<option value="'+events[0].id+'">'+esc(events[0].nom)+'</option>';
    }
    render();
    var d=new Date();
    document.getElementById('maj-time').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
  }catch(e){
    document.getElementById('liste').innerHTML='<div class="empty">Erreur de chargement. Réessai…</div>';
  }
}

function render(){
  var sel=document.getElementById('ev-sel');
  var evId=sel.value||(events[0]&&events[0].id);
  if(!evId){document.getElementById('liste').innerHTML='<div class="empty">Aucun événement.</div>';return;}
  var ev=events.find(function(e){return e.id===evId;});
  document.getElementById('ev-nom').textContent=ev?ev.nom:'';

  var invEv=invitations.filter(function(i){return i.evenement_id===evId;});
  var presentsIds=presences.filter(function(p){return p.evenement_id===evId;}).map(function(p){return p.user_id;});
  var absents=invEv.filter(function(i){return presentsIds.indexOf(i.user_id)<0;})
    .map(function(i){return users.find(function(u){return u.id===i.user_id;});})
    .filter(Boolean)
    .sort(function(a,b){return (a.nom||'').localeCompare(b.nom||'');});

  document.getElementById('nb-invites').textContent=invEv.length;
  document.getElementById('nb-presents').textContent=presentsIds.filter(function(id){return invEv.some(function(i){return i.user_id===id;});}).length;
  document.getElementById('nb-absents').textContent=absents.length;

  var q=(document.getElementById('search').value||'').toLowerCase().trim();
  var filtered=q?absents.filter(function(u){return (u.nom+' '+u.prenom).toLowerCase().indexOf(q)>=0;}):absents;

  if(!filtered.length){
    document.getElementById('liste').innerHTML='<div class="empty">'+(q?'Aucun résultat.':'🎉 Tous les invités sont présents !')+'</div>';
    return;
  }
  document.getElementById('liste').innerHTML=filtered.map(function(u){
    return '<div class="row"><div><div class="name">'+esc(u.nom)+' '+esc(u.prenom)+'</div>'
      +'<div class="meta">'+esc(u.departement||'')+(u.contrat?' · '+esc(u.contrat):'')+'</div></div>'
      +'<div class="abs">Absent(e)</div></div>';
  }).join('');
}

load();
setInterval(load,10000);
</script>
</body>
</html>
